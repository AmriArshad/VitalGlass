[package]
name = "vitalglass"
version = "0.1.0"
description = "Desktop dashboard for your own Google Health data"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "vitalglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
vitalglass-core = { path = "../crates/vitalglass-core" }
tokio = { version = "1.54.1", features = ["sync", "time"] }
chrono = "0.4.45"
dirs = "7.0.0"
tauri-plugin-single-instance = "2.5.4"
