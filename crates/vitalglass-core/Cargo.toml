[package]
name = "vitalglass-core"
version = "0.1.0"
edition.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
keyring = "4.2.0"
open = "5.4.5"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt"] }
url = "2.5.8"
